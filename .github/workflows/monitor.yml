name: Scheduled Drift Monitoring

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pytest
      - run: pytest tests/ -v

  check-drift:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests

      - name: Build baseline (seed — see README for upgrading to --from-live)
        run: python drift/baseline_builder.py --from-seed --output baseline.json

      - name: Check for real drift against Project 1's live API
        id: drift_check
        env:
          LOG_ANOMALY_API_URL: ${{ vars.LOG_ANOMALY_API_URL }}
          DEMO_PASSWORD: ${{ secrets.LOG_ANOMALY_DEMO_PASSWORD }}
        run: |
          python drift/run_drift_check.py \
            --api-url "$LOG_ANOMALY_API_URL" \
            --username analyst \
            --password "$DEMO_PASSWORD" \
            --baseline baseline.json

      - name: Trigger retraining if drift threshold exceeded
        if: steps.drift_check.outputs.psi_score > 0.25
        env:
          GITHUB_TOKEN: ${{ secrets.RETRAIN_TRIGGER_TOKEN }}
        run: |
          python retrain_trigger/trigger_retrain.py \
            --psi-score ${{ steps.drift_check.outputs.psi_score }} \
            --threshold 0.25 \
            --github-token $GITHUB_TOKEN \
            --target-repo sugarhillconsultants/reproducible-finetuning-pipeline
